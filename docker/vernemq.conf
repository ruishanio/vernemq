## Docker 镜像默认配置。
## 该文件会在构建镜像时复制到 /vernemq/etc/vernemq.conf。

## 开发和最简 docker run 体验默认允许匿名连接。
## 生产环境建议通过挂载配置文件关闭匿名访问并启用认证/ACL。
allow_anonymous = on

## VerneMQ 生成 vm.args 时需要长节点名，单容器默认使用本地地址。
nodename = VerneMQ@127.0.0.1
distributed_cookie = vmq

## 容器内服务需要监听 0.0.0.0，宿主机端口映射才可访问。
listener.tcp.default = 0.0.0.0:1883
listener.ws.default = 0.0.0.0:8080
listener.http.default = 0.0.0.0:8888
listener.vmq.clustering = 0.0.0.0:44053

## 固定 Erlang distribution 端口范围，和 Dockerfile EXPOSE 保持一致。
erlang.async_threads = 64
erlang.max_ports = 262144
erlang.distribution.port_range.minimum = 9100
erlang.distribution.port_range.maximum = 9109

## 容器日志写到标准输出，便于 docker logs / 编排系统采集。
log.console = console

## Webhooks 插件。
## 如果 webhook 服务跑在宿主机上，可以使用 host.docker.internal 访问。
## 根据业务需要修改 endpoint。
plugins.vmq_webhooks = on

## 认证：客户端连接时校验用户名、密码、client_id 等信息。
vmq_webhooks.auth.hook = auth_on_register
vmq_webhooks.auth.endpoint = http://host.docker.internal:8081/vernemq/auth

## 授权：发布消息时校验是否允许向目标 topic 发布。
vmq_webhooks.authz_publish.hook = auth_on_publish
vmq_webhooks.authz_publish.endpoint = http://host.docker.internal:8081/vernemq/authorize/publish

## 授权：订阅 topic 时校验是否允许订阅。
vmq_webhooks.authz_subscribe.hook = auth_on_subscribe
vmq_webhooks.authz_subscribe.endpoint = http://host.docker.internal:8081/vernemq/authorize/subscribe

## 设备上线：客户端成功连接后触发。
vmq_webhooks.device_online.hook = on_register
vmq_webhooks.device_online.endpoint = http://host.docker.internal:8081/vernemq/device/online

## 设备下线：客户端离线时触发。
vmq_webhooks.device_offline.hook = on_client_offline
vmq_webhooks.device_offline.endpoint = http://host.docker.internal:8081/vernemq/device/offline
